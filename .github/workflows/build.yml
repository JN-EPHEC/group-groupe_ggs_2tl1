name: Build - Backend

on:
  workflow_run:
    workflows: ["Continuous Integration - Tests"]
    types: [completed]

jobs:
  build-back:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v3

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & push back
        run: |
          docker build -f server/Dockerfile -t erreur504/ggs-api:latest .
          docker push erreur504/ggs-api:latest

      - name: Deploy back sur VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/GGS
            docker stack deploy -c docker-compose.yml ggs --with-registry-auth